<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="game-card">
    <header class="game-header">
      <div>
        <h1>Tic Tac Toe</h1>
        <p class="subtitle">Classic 3-in-a-row</p>
      </div>

      <div class="controls">
        <select id="mode">
          <option value="pvp">2 Players</option>
          <option value="ai">vs Computer</option>
        </select>
        <button id="startBtn" class="btn primary">New Game</button>
        <button id="resetScore" class="btn ghost">Reset</button>
      </div>
    </header>

    <div class="status-bar">
      <div class="turn-box">Turn: <span id="turnPlayer">X</span></div>
      <div class="score-box">
        <span>X: <strong id="scoreX">0</strong></span>
        <span>O: <strong id="scoreO">0</strong></span>
      </div>
    </div>

    <div id="board" class="board"></div>

    <div id="message" class="game-message"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
